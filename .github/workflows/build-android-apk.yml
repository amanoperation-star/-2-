name: Build Android APK (Mobile & Android TV)

on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: 'نشر ملف APK في صفحة Releases أيضاً (اختياري)'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci --legacy-peer-deps --no-audit --no-fund
          else
            npm install --legacy-peer-deps --no-audit --no-fund
          fi

      - name: Build web assets & sync trimmed APK bundle
        run: npm run apk:sync

      - name: Build Debug APK with Gradle
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Prepare named APK copy
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk android/app/build/outputs/apk/debug/almawaqeet-mihrab-android-tv.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: almawaqeet-mihrab-android-tv-mobile-apk
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/outputs/apk/debug/almawaqeet-mihrab-android-tv.apk
          retention-days: 30

      - name: Publish GitHub Release APK (on version tags or manual selection)
        if: startsWith(github.ref, 'refs/tags/v') || github.event.inputs.publish_release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG_NAME="${GITHUB_REF_NAME}"
          if ! [[ "$TAG_NAME" =~ ^v ]]; then
            TAG_NAME="v$(date +'%Y.%m.%d-%H%M')"
          fi
          gh release delete "$TAG_NAME" --yes 2>/dev/null || true
          gh release create "$TAG_NAME" \
            android/app/build/outputs/apk/debug/almawaqeet-mihrab-android-tv.apk \
            android/app/build/outputs/apk/debug/app-debug.apk \
            --title "تطبيق مواقيت الصلاة - محراب ($TAG_NAME)" \
            --notes "نسخة موحّدة لهواتف الأندرويد وشاشات Android TV / Google TV (مع دعم الريموت ومنع إطفاء الشاشة والعمل بدون إنترنت)."
